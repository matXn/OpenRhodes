<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<title>Rhodes Light 配网</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:"Rhodes Title";font-weight:600;font-display:block;src:url(data:font/woff;base64,/*OUTFIT_WOFF*/) format("woff")}
:root{--bg:#0d0c0b;--line:#2a2622;--text:#ece6dd;--dim:#8f877c;--faint:#5e584f;
  --amber:#f5a524;--bad:#ef6b5b;--ok:#7fc48a;
  --sig-good:#8fcf9c;--sig-mid:#e8c873;--sig-weak:#eea36a}
html,body{background:var(--bg);color:var(--text);min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:420px;margin:0 auto;padding:34px 20px 28px;display:flex;flex-direction:column;gap:18px}
a{color:inherit;text-decoration:none}

/* 标题：内嵌的 Outfit 子集（tools/make_title_font.py 生成），热点下没有外网也能显示 */
h1{font-family:"Rhodes Title","Outfit","Avenir Next","Futura",sans-serif;font-size:36px;font-weight:600;letter-spacing:.5px;line-height:1.1}

/* 无边框按钮：纯文字/图标 */
button{min-height:44px;font:inherit;color:var(--amber);background:none;border:0;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.6}
button:disabled{opacity:.4;cursor:default}

/* ---------- 状态区 ---------- */
#status{display:flex;flex-direction:column;gap:6px}
#status .top{display:flex;align-items:center;justify-content:space-between}
#status .tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--dim)}
#status .tag svg{width:16px;height:16px}
#status .top button{font-size:13px}
#status .big{font-size:26px;font-weight:600;line-height:1.25;word-break:break-all}
#status .sub{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
#status.ok .tag{color:var(--ok)}
#status.bad .tag,#status.bad .big{color:var(--bad)}
#status.bad .big{font-size:19px}
#status.busy .tag{color:var(--amber)}
.addr{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.addr small{font-size:12px;color:var(--dim)}
.addr .line{flex-wrap:wrap;display:flex;align-items:center;gap:10px}
.addr a{font-size:24px;font-weight:600;color:var(--amber)}
.addr a.ip{font-size:15px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.addr .note{font-size:12px;color:var(--faint)}
.copy{color:var(--dim);display:inline-flex;padding:6px}
.copy svg{width:17px;height:17px}
.copy.done{color:var(--ok)}
.spin{width:14px;height:14px;border:2px solid rgba(245,165,36,.25);border-top-color:var(--amber);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* ---------- 网络列表 ---------- */
#picker.hide{display:none}
.head{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.head h2{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.5px}
#nets{list-style:none}
#nets li{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
#nets li.sel .name{color:var(--amber)}
#nets .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.lock{width:12px;height:12px;fill:none;stroke:var(--dim);stroke-width:1.6}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px;color:var(--sig-weak)}
.bars.good{color:var(--sig-good)}.bars.mid{color:var(--sig-mid)}
.bars span{width:3px;border-radius:1px;background:var(--line)}
.bars span.f{background:currentColor}
#join{display:none;gap:14px;flex-direction:column;margin-top:14px}
#join.show{display:flex}
/* 输入框：只留下划线 */
input{font:inherit;font-size:16px;color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);
  border-radius:0;padding:10px 0;width:100%}
input:focus{outline:none;border-bottom-color:var(--amber)}
#connect{align-self:flex-start;font-size:16px;font-weight:600;padding:6px 0}

#saved{display:flex;flex-direction:column;gap:8px}
#saved h2{font-size:13px;color:var(--dim);font-weight:500}
#savedNote{font-size:12px;color:var(--faint)}
#savedNets{list-style:none}
#savedNets li{padding:12px 0;border-bottom:1px solid var(--line)}
#savedNets .savedRow{display:flex;align-items:center;gap:8px}
#savedNets .name{flex:1;overflow-wrap:anywhere;min-width:0}
#savedNets .actions{display:flex;align-items:center;gap:16px;margin-top:5px}
#savedNets button{font-size:13px;min-height:44px}
#savedNets .forget{color:var(--dim)}
#toast{min-height:18px;font-size:13px;color:var(--dim)}
#toast.bad{color:var(--bad)}
footer{display:flex;justify-content:center;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
footer a{display:inline-flex;align-items:center;gap:6px}
footer svg{width:14px;height:14px;fill:currentColor}
</style>
</head>
<body>
<main>
  <h1>Rhodes Light</h1>

  <div id="status"><span class="tag">读取中…</span></div>

  <section id="saved" aria-label="已保存网络">
    <h2>自动连接顺序</h2>
    <p id="savedNote">最多保存 8 个网络；手动连接成功的网络优先，密码在连接成功后保存。</p>
    <ul id="savedNets"></ul>
  </section>
  <div id="picker">
    <div class="head"><h2>选择网络</h2><button id="scan">扫描</button></div>
    <ul id="nets"></ul>
    <form id="join" autocomplete="off">
      <input id="ssid" placeholder="Wi-Fi 名称" maxlength="32" autocapitalize="off" spellcheck="false">
      <input id="pass" type="password" placeholder="密码" maxlength="64">
      <button id="connect" type="submit">连接</button>
    </form>
  </div>
  <div id="toast"></div>

  <footer>By
    <a href="https://github.com/matXn/OpenRhodes" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>OpenRhodes</a>
  </footer>
</main>
<script>/*SETUP*/</script>
</body>
</html>
