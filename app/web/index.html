<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RhodesLight · OpenRhodes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <div class="device" id="device">

    <header class="toolbar">
      <button class="icon-btn" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M19 12H5M11 6L5 12L11 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="titles">
        <h1>RhodesLight</h1>
        <p>已连接</p>
      </div>
      <button class="icon-btn" type="button" aria-label="设备设置">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M4 7H20M4 17H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="9" cy="7" r="2.8" fill="#0D0C0A" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="15" cy="17" r="2.8" fill="#0D0C0A" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <div class="lamp">
        <div class="halo" id="halo" aria-hidden="true"></div>
        <section class="card" id="card" aria-label="Rhodes Light">
          <div class="card-plane" id="cardPlane">
            <canvas id="cardCanvas"></canvas>
            <div class="card-top">
              <span class="card-title">Rhodes Light</span>
              <span class="dot" id="statusDot" title="已连接"></span>
            </div>
            <div class="card-bottom">
              <div class="percent" id="percent">
                <span class="p-static" id="pStatic">56<span class="pct-sign">%</span></span>
                <span class="p-roll">
                  <span class="p-line" id="pLower">56<span class="pct-sign">%</span></span>
                  <span class="p-line" id="pUpper">57<span class="pct-sign">%</span></span>
                </span>
              </div>
              <span class="hint">滑动调光<br>轻点开关</span>
            </div>
            <div class="light-rail" aria-hidden="true">
              <span class="rail-fill" id="railFill"></span>
            </div>
          </div>
        </section>
      </div>

      <div class="mode" id="mode" role="radiogroup" aria-label="灯光模式">
        <button class="seg is-on" type="button" role="radio" aria-checked="true" data-breathing="0">常亮</button>
        <button class="seg" type="button" role="radio" aria-checked="false" data-breathing="1">呼吸</button>
      </div>
    </main>

    <footer class="credit">
      <span>By</span>
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M8,0C3.58,0 0,3.58 0,8c0,3.54 2.29,6.53 5.47,7.59.4,.07.55,-.17.55,-.38 0,-.19-.01,-.82-.01,-1.49-2.01,.37-2.53,-.49-2.69,-.94-.09,-.23-.48,-.94-.82,-1.13-.28,-.15-.68,-.52-.01,-.53.63,-.01 1.08,.58 1.23,.82.72,1.21 1.87,.87 2.33,.66.07,-.52.28,-.87.51,-1.07-1.78,-.2-3.64,-.89-3.64,-3.95 0,-.87.31,-1.59.82,-2.15-.08,-.2-.36,-1.02.08,-2.12 0,0.67,-.21 2.2,.82.64,-.18 1.32,-.27 2,-.27.68,0 1.36,.09 2,.27 1.53,-1.04 2.2,-.82 2.2,-.82.44,1.1.16,1.92.08,2.12.51,.56.82,1.27.82,2.15 0,3.07-1.87,3.75-3.65,3.95.29,.25.54,.73.54,1.48 0,1.07-.01,1.93-.01,2.2 0,.21.15,.46.55,.38A8.013,8.013 0,0 0,16 8c0,-4.42-3.58,-8-8,-8z"/>
      </svg>
      <span>OpenRhodes</span>
    </footer>

  </div>
</div>
<script src="app.js"></script>
</body>
</html>
