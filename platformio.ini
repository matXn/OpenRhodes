; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3_nopsram]
; 锁定 Arduino core 2.x 的现有平台，避免与其他 ESP32 平台混用。
platform = espressif32@6.13.0
board = esp32-s3-devkitm-1
framework = arduino
board_build.flash_mode = qio

; 保留现有 4 MB 兼容分区；当前测试模组为 8 MB。
; 修改分区前请核对模组容量和已有 NVS / OTA 布局。
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 原生 USB-Serial-JTAG 上 RTS/DTR 直接控制 EN/IO0。
; 监视器打开时若拉起 RTS，芯片会一直卡在复位里，表现为屏幕一片空白。
monitor_rts = 0
monitor_dtr = 0

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; HTTP / WiFi / DNS / mDNS 使用 Arduino core 自带库。
