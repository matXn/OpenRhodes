<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Touchpad</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0d0c0b;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================= 矩形触控板 =================
   纯净无文字、无线条分割。
   整个矩形本身就是一盏灯，通过本体颜色的明暗、光晕强度直接表现亮度。
   ============================================= */
#pad {
  position: relative;
  width: 320px;
  height: 220px;
  border-radius: 24px;
  cursor: grab;
  touch-action: none;
  border: 1px solid var(--pad-border, rgba(245, 158, 11, 0.2));
  background: var(--pad-color, #231b12);
  box-shadow: var(--pad-shadow, 0 10px 30px rgba(0, 0, 0, 0.6));
}

#pad.dragging {
  cursor: grabbing;
}
</style>
</head>
<body>

<div id="pad" role="slider" aria-label="dimmer" aria-valuemin="1" aria-valuemax="100" aria-valuenow="65"></div>

<script>/*CONTROLLER*/</script>
</body>
</html>
