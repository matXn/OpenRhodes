<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">OpenRhodes 项目封面</title>
  <desc id="desc">深色背景上的暖色光晕与抽象灯具，代表触摸、灯光和连接。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b20"/><stop offset=".58" stop-color="#11191d"/><stop offset="1" stop-color="#24201c"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45423a"/><stop offset=".35" stop-color="#252b2d"/><stop offset="1" stop-color="#10171a"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2d0"/><stop offset=".4" stop-color="#f3c779"/><stop offset="1" stop-color="#c08045"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efd1a0" stop-opacity=".68"/><stop offset="1" stop-color="#f4d6a4" stop-opacity=".05"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f4ba69" stop-opacity=".26"/><stop offset=".55" stop-color="#cb8c49" stop-opacity=".08"/><stop offset="1" stop-color="#cb8c49" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#f6e3c6" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1440" height="480" rx="18" fill="url(#background)"/>
  <rect width="1440" height="480" rx="18" fill="url(#grid)"/>
  <ellipse cx="1090" cy="248" rx="350" ry="220" fill="url(#glow)"/>
  <path d="M74 72h41" stroke="#e5b875" stroke-width="3" stroke-linecap="round"/>
  <text x="74" y="130" fill="#e4ba7c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4">触摸 · 灯光 · 连接</text>
  <text x="70" y="226" fill="#f8f2e8" font-family="Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">OpenRhodes</text>
  <text x="74" y="270" fill="#b9b7ae" font-family="Arial, sans-serif" font-size="20" letter-spacing="1">ESP32-S3 灯光固件</text>
  <path d="M74 317h450" stroke="#e8d5b5" stroke-opacity=".17"/>
  <circle cx="79" cy="357" r="5" fill="#d6a76a"/>
  <text x="99" y="363" fill="#c1b6a6" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">为日常光感而设计</text>
  <g transform="translate(842 47)">
    <rect x="39" y="20" width="364" height="360" rx="34" fill="#080d0f" opacity=".32" transform="translate(15 15)"/>
    <rect x="39" y="20" width="364" height="360" rx="34" fill="url(#surface)" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="57" y="38" width="328" height="324" rx="23" fill="#12191b" stroke="#f5e3bd" stroke-opacity=".14"/>
    <rect x="77" y="58" width="288" height="234" rx="10" fill="#d49959" opacity=".13"/>
    <rect x="88" y="69" width="266" height="212" rx="8" fill="url(#light)"/>
    <path d="M88 180h266" stroke="#fff8e8" stroke-opacity=".18"/>
    <path d="M221 69v212" stroke="#fff8e8" stroke-opacity=".15"/>
    <path d="M98 80h246" stroke="#fff9e8" stroke-opacity=".38" stroke-linecap="round"/>
    <text x="221" y="329" text-anchor="middle" fill="#e4d7c2" fill-opacity=".52" font-family="Arial, sans-serif" font-size="9" letter-spacing="4">触摸控制</text>
    <g fill="#dbb987" opacity=".7"><circle cx="140" cy="344" r="2"/><circle cx="158" cy="344" r="2"/><circle cx="176" cy="344" r="2"/><circle cx="194" cy="344" r="2"/><circle cx="212" cy="344" r="2"/><circle cx="230" cy="344" r="2"/><circle cx="248" cy="344" r="2"/><circle cx="266" cy="344" r="2"/><circle cx="284" cy="344" r="2"/><circle cx="302" cy="344" r="2"/></g>
    <path d="M71 393h300" stroke="#f5d5a5" stroke-opacity=".18" stroke-linecap="round"/>
  </g>
  <text x="1364" y="446" text-anchor="end" fill="#d4c1a2" fill-opacity=".45" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">概念插画 / 非产品实拍</text>
</svg>
